services:
  # 1. Database Service (SQL Server)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qm_database
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. ASP.NET Core Backend
  backend:
    build:
      context: ./QM-master
      dockerfile: Dockerfile
    container_name: qm_backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=QM;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=true;
      - Jwt__Key=ThisIsMyVeryLongAndSecureSecretKey123!
      - Jwt__Issuer=http://localhost:7002
      - Jwt__Audience=http://localhost:3001

  # 3. React Frontend
  frontend:
    build:
      context: ./react-risk-system
      dockerfile: Dockerfile
    container_name: qm_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
